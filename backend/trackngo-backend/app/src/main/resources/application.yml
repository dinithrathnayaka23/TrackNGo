server:
  # Render assigns its own port via $PORT; local dev falls back to 8080.
  port: ${PORT:8080}

spring:
  main:
    allow-bean-definition-overriding: true
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties],optional:file:../../../.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  jpa:
    hibernate:
      # Production schema is managed by hand-written migrations
      # (database/migrations/*.sql), not Hibernate — validate only checks
      # that the JPA entities agree with whatever schema is already there.
      # Override locally with JPA_DDL_AUTO=update if you need Hibernate to
      # patch a fresh/older local database while iterating.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  ai:
    openai:
      # Placeholder default keeps the app bootable without an AI key configured.
      # AI calls then fail at call time and hit the deterministic fallback response,
      # instead of preventing the whole application context from starting.
      api-key: ${AI_API_KEY:${GEMINI_API_KEY:ai-not-configured}}
      base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
      chat:
        options:
          model: ${AI_MODEL:${GEMINI_MODEL:gemini-1.5-pro}}
          temperature: 0.7

trackngo:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  # Comma-separated browser origins allowed to call the API and open the
  # WebSocket/STOMP endpoints with credentials. Local dev defaults to the
  # admin dashboard's Vite dev server; set FRONTEND_URL on Render to the
  # deployed Vercel domain(s) (comma-separate if you add a preview domain).
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://127.0.0.1:5173}

# Blank-safe: an unset Twilio credential disables SMS sending (falls back to
# logging the code) rather than crashing the whole app on boot — matching the
# same pattern already used for mail/PayHere/AI below.
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  phone-number: ${TWILIO_PHONE_NUMBER:}
  messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
  default-country-code: ${TWILIO_DEFAULT_COUNTRY_CODE:+94}

sms:
  provider: ${SMS_PROVIDER:twilio}
  android-gateway:
    url: ${SMS_ANDROID_GATEWAY_URL:}
    api-key: ${SMS_ANDROID_GATEWAY_API_KEY:}

# Used by the forgot-password OTP email flow. Left blank-safe so the app
# still boots without SMTP configured; the OTP sender then logs the code to
# the console instead of emailing it (see auth-user-module OtpEmailSender).
spring.mail:
  host: ${MAIL_HOST:}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  from: ${MAIL_FROM:no-reply@trackngo.local}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true

# GoogleTokenVerifier (auth-user-module) reads this to validate a Google
# Sign-In ID token's audience claim. No controller currently exposes this
# flow — set GOOGLE_CLIENT_ID only once that endpoint exists.
google:
  client-id: ${GOOGLE_CLIENT_ID:}

payhere:
  merchant-id: ${PAYHERE_MERCHANT_ID:}
  merchant-secret: ${PAYHERE_MERCHANT_SECRET:}
  sandbox: ${PAYHERE_SANDBOX:true}

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY}

# Custom fallback model configuration
ai:
  model:
    timeout-seconds: ${AI_MODEL_TIMEOUT_SECONDS:12}
    functions-enabled: ${AI_MODEL_FUNCTIONS_ENABLED:false}
    direct-http-enabled: ${AI_MODEL_DIRECT_HTTP_ENABLED:true}
  fallback:
    model: ${AI_FALLBACK_MODEL:${GEMINI_FALLBACK_MODEL:gemini-1.5-flash}}
