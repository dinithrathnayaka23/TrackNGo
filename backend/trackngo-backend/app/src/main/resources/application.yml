server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties],optional:file:../../../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/trackngo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:dinithmora2003}
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

trackngo:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-change-this-secret}
    expiration-ms: 86400000

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:AC5fdb70837bf4bfcaaaa9fa71bf23877f}
  auth-token: ${TWILIO_AUTH_TOKEN:8eb0c17bb64110819385b92b60795508}
  phone-number: ${TWILIO_PHONE_NUMBER:+16416936521}
  messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:MG57907a2acf84d25fa7cbf9bcd8255ee6}
  default-country-code: ${TWILIO_DEFAULT_COUNTRY_CODE:+94}

sms:
  provider: ${SMS_PROVIDER:twilio}
  android-gateway:
    url: ${SMS_ANDROID_GATEWAY_URL:}
    api-key: ${SMS_ANDROID_GATEWAY_API_KEY:}

payhere:
  merchant-id: ${PAYHERE_MERCHANT_ID}
  merchant-secret: ${PAYHERE_MERCHANT_SECRET}
  sandbox: ${PAYHERE_SANDBOX:true}
