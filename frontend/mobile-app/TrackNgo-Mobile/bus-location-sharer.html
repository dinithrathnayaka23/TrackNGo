<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrackNGo — Bus Location Sharer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F0F4F8;
      color: #1E293B;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #0F172A;
    }
    .subtitle { font-size: 13px; color: #64748B; margin-bottom: 20px; }

    .card {
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      padding: 24px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 16px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: #64748B;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #E2E8F0;
      border-radius: 10px;
      font-size: 14px;
      color: #1E293B;
      background: #F8FAFC;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #2F6BFF;
      background: #FFFFFF;
    }

    .server-row {
      display: flex;
      gap: 8px;
    }
    .server-row input { flex: 1; }
    .server-row input:last-child { max-width: 80px; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.85; }
    .btn-primary { background: #2F6BFF; color: #FFFFFF; }
    .btn-danger { background: #EF4444; color: #FFFFFF; }
    .btn-success { background: #22C55E; color: #FFFFFF; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .status-idle { background: #F1F5F9; color: #64748B; }
    .status-active { background: #ECFDF5; color: #059669; }
    .status-error { background: #FEF2F2; color: #DC2626; }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot-gray { background: #94A3B8; }
    .dot-green { background: #22C55E; animation: pulse 1.5s infinite; }
    .dot-red { background: #EF4444; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.5); }
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .info-box {
      padding: 10px;
      background: #F8FAFC;
      border-radius: 8px;
      text-align: center;
    }
    .info-box .lbl { font-size: 10px; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.5px; }
    .info-box .val { font-size: 14px; font-weight: 700; color: #1E293B; margin-top: 2px; }

    .mode-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .mode-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid #E2E8F0;
      border-radius: 10px;
      background: #FFFFFF;
      font-size: 12px;
      font-weight: 700;
      color: #64748B;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active {
      border-color: #2F6BFF;
      background: #EFF6FF;
      color: #2F6BFF;
    }

    .log-box {
      max-height: 120px;
      overflow-y: auto;
      background: #F8FAFC;
      border-radius: 8px;
      padding: 10px;
      font-size: 11px;
      color: #64748B;
      font-family: monospace;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <h1>🚌 TrackNGo Bus Sharer</h1>
  <p class="subtitle">Share this device's location as a bus</p>

  <!-- Config Card -->
  <div class="card">
    <label>Server Address</label>
    <div class="server-row">
      <input type="text" id="serverHost" placeholder="192.168.x.x" value="" />
      <input type="text" id="serverPort" placeholder="8080" value="8080" />
    </div>

    <label>Bus Number</label>
    <input type="text" id="busNumber" placeholder="e.g. ND-4589" value="ND-4589" />

    <label>Sharing Mode</label>
    <div class="mode-toggle">
      <div class="mode-btn active" id="modeRest" onclick="setMode('rest')">REST API</div>
      <div class="mode-btn" id="modeWs" onclick="setMode('ws')">WebSocket</div>
    </div>

    <div id="statusBar" class="status-bar status-idle">
      <div class="dot dot-gray"></div>
      <span>Not sharing</span>
    </div>

    <button class="btn btn-primary" id="startBtn" onclick="startSharing()">
      📍 Start Sharing Location
    </button>
    <button class="btn btn-danger" id="stopBtn" onclick="stopSharing()" style="display:none; margin-top:8px;">
      ⏹ Stop Sharing
    </button>
  </div>

  <!-- Info Card -->
  <div class="card" id="infoCard" style="display:none;">
    <div class="info-grid">
      <div class="info-box">
        <div class="lbl">Latitude</div>
        <div class="val" id="infoLat">—</div>
      </div>
      <div class="info-box">
        <div class="lbl">Longitude</div>
        <div class="val" id="infoLng">—</div>
      </div>
      <div class="info-box">
        <div class="lbl">Speed</div>
        <div class="val" id="infoSpeed">—</div>
      </div>
      <div class="info-box">
        <div class="lbl">Updates Sent</div>
        <div class="val" id="infoCount">0</div>
      </div>
    </div>
  </div>

  <!-- Log Card -->
  <div class="card">
    <label>Activity Log</label>
    <div class="log-box" id="logBox">Waiting to start...</div>
  </div>

<script>
  let mode = 'rest';
  let watchId = null;
  let ws = null;
  let updateCount = 0;

  function setMode(m) {
    mode = m;
    document.getElementById('modeRest').classList.toggle('active', m === 'rest');
    document.getElementById('modeWs').classList.toggle('active', m === 'ws');
  }

  function log(msg) {
    const box = document.getElementById('logBox');
    const time = new Date().toLocaleTimeString();
    box.innerHTML = `[${time}] ${msg}<br>` + box.innerHTML;
  }

  function setStatus(type, message) {
    const bar = document.getElementById('statusBar');
    bar.className = `status-bar status-${type}`;
    const dotClass = type === 'active' ? 'dot-green' : type === 'error' ? 'dot-red' : 'dot-gray';
    bar.innerHTML = `<div class="dot ${dotClass}"></div><span>${message}</span>`;
  }

  function getBaseUrl() {
    const host = document.getElementById('serverHost').value.trim();
    const port = document.getElementById('serverPort').value.trim();
    if (!host) { alert('Please enter the server IP address'); return null; }
    return `http://${host}:${port}`;
  }

  function getWsUrl() {
    const host = document.getElementById('serverHost').value.trim();
    const port = document.getElementById('serverPort').value.trim();
    if (!host) return null;
    return `ws://${host}:${port}/ws/tracking`;
  }

  async function sendViaRest(data) {
    const base = getBaseUrl();
    if (!base) return;
    try {
      const resp = await fetch(`${base}/api/tracking/live-location`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      log(`✅ Sent via REST (${data.latitude.toFixed(5)}, ${data.longitude.toFixed(5)})`);
    } catch (err) {
      log(`❌ REST error: ${err.message}`);
      setStatus('error', 'Send failed — check server');
    }
  }

  function sendViaWs(data) {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      log('❌ WebSocket not connected');
      connectWs();
      return;
    }
    ws.send(JSON.stringify(data));
    log(`✅ Sent via WS (${data.latitude.toFixed(5)}, ${data.longitude.toFixed(5)})`);
  }

  function connectWs() {
    const url = getWsUrl();
    if (!url) return;
    log(`Connecting WebSocket to ${url}...`);
    ws = new WebSocket(url);
    ws.onopen = () => { log('🟢 WebSocket connected'); setStatus('active', 'Sharing via WebSocket'); };
    ws.onclose = () => { log('🔴 WebSocket disconnected'); };
    ws.onerror = (e) => { log('❌ WebSocket error'); };
  }

  function startSharing() {
    if (!navigator.geolocation) {
      alert('Geolocation is not supported by this browser.');
      return;
    }

    const busNumber = document.getElementById('busNumber').value.trim();
    if (!busNumber) { alert('Please enter a bus number'); return; }

    if (mode === 'ws') connectWs();

    log('Starting location sharing...');
    setStatus('active', 'Sharing location');
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'flex';
    document.getElementById('infoCard').style.display = 'block';

    watchId = navigator.geolocation.watchPosition(
      (pos) => {
        const data = {
          busNumber,
          latitude: pos.coords.latitude,
          longitude: pos.coords.longitude,
          heading: pos.coords.heading,
          speed: pos.coords.speed,
          timestamp: Date.now(),
        };

        updateCount++;
        document.getElementById('infoLat').textContent = data.latitude.toFixed(6);
        document.getElementById('infoLng').textContent = data.longitude.toFixed(6);
        document.getElementById('infoSpeed').textContent =
          data.speed != null ? `${(data.speed * 3.6).toFixed(1)} km/h` : '—';
        document.getElementById('infoCount').textContent = updateCount;

        if (mode === 'rest') sendViaRest(data);
        else sendViaWs(data);
      },
      (err) => {
        log(`❌ Location error: ${err.message}`);
        setStatus('error', 'Location access denied');
      },
      {
        enableHighAccuracy: true,
        maximumAge: 2000,
        timeout: 10000,
      }
    );
  }

  function stopSharing() {
    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    if (ws) { ws.close(); ws = null; }
    updateCount = 0;
    setStatus('idle', 'Stopped');
    document.getElementById('startBtn').style.display = 'flex';
    document.getElementById('stopBtn').style.display = 'none';
    document.getElementById('infoCard').style.display = 'none';
    log('Sharing stopped');
  }

  // Auto-fill server host from current page URL
  (function() {
    const host = location.hostname;
    if (host && host !== 'localhost' && host !== '127.0.0.1') {
      document.getElementById('serverHost').value = host;
    }
  })();
</script>

</body>
</html>
